# Framework Laptop 12 tablet-mode switch (SW_TABLET_MODE via ACPI INT33D3).
#
# soc_button_array binds the gpio-keys node that carries SW_TABLET_MODE, but it
# needs the Tiger Lake pin controller already registered when it probes. On a
# normal boot that ordering is a race, and it is NOT deterministic: on this
# machine the switch came up UNBOUND on one boot and BOUND on the next two,
# with no configuration change in between. Loading both from the initramfs, in
# this order, removes the race.
#
# Install to:  /etc/mkinitcpio.conf.d/fw12-tablet.conf
# Then:        sudo mkinitcpio -P
#
# Note the `+=`. Community write-ups usually give `MODULES=(...)`, which
# OVERWRITES the array and would silently drop other drop-ins -- on Omarchy
# that means losing `MODULES+=(thunderbolt)`.
#
# Note also the directory. Guidance circulating in the Framework forums points
# at /etc/mkinitcpio.d/99-framework-12.conf, but on mkinitcpio 41 that path is
# the *presets* directory; a config file there is ignored entirely. The drop-in
# config directory is /etc/mkinitcpio.conf.d/. That is a plausible reason the
# documented fix is reported not to work for some people.
#
# pinctrl_tigerlake is correct for this unit (13th Gen Core i5-1334U): it is
# the module actually loaded and in use here. Some 13th-gen reports call for
# pinctrl_alderlake instead; check `lsmod | grep pinctrl` before assuming.
MODULES+=(pinctrl_tigerlake soc_button_array)
